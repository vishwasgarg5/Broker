name: BROKER - Pre-market research pipeline

on:
  workflow_dispatch:
  schedule:
    # ~06:00 IST (00:30 UTC) Mon–Fri. Calendar gating will be added in Priority 2.
    - cron: "30 0 * * 1-5"

permissions:
  contents: read

concurrency:
  group: broker-pre-market
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate contracts, configuration and unit tests
        run: |
          python -m unittest discover -s tests -v
          PYTHONPATH=src python -m broker.validation

      - name: Run independent NSE data sources (UDiFF + Nifty 50 observation)
        id: pipeline
        continue-on-error: true
        run: |
          set -euo pipefail
          PYTHONPATH=src python src/data_pipeline.py

      - name: Collect provenance and any available data artifacts
        if: always()
        run: |
          set -euo pipefail
          mkdir -p run_artifacts
          {
            echo "workflow=pre_market"
            echo "mode=research_and_paper_only"
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "triggered_by=${GITHUB_EVENT_NAME}"
            echo "actor=${GITHUB_ACTOR}"
            echo "pipeline_outcome=${{ steps.pipeline.outcome }}"
            date -u +"retrieved_at_utc=%Y-%m-%dT%H:%M:%SZ"
          } > run_artifacts/run-manifest.txt

          if [ -d data ]; then
            cp -a data run_artifacts/data
          else
            echo "No data directory was produced by either source." > run_artifacts/NO_DATA.txt
          fi

          echo "=== Artifact inventory ==="
          find run_artifacts -type f | sort
          if [ -d run_artifacts/data/manifests ]; then
            echo "=== Manifests ==="
            find run_artifacts/data/manifests -name '*.json' -exec echo '--- {} ---' \; -exec cat {} \;
          fi

      - name: Upload run-scoped partial or complete artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broker-pre-market-${{ github.run_id }}-${{ github.run_attempt }}
          path: run_artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Fail job when either required NSE source failed
        if: always() && steps.pipeline.outcome != 'success'
        run: |
          echo "At least one required NSE source failed. Available partial artifacts were uploaded."
          exit 1
