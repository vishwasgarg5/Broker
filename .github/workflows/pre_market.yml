name: BROKER - Pre-market research pipeline
on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * 1-5"
permissions:
  contents: read
concurrency:
  group: broker-pre-market
  cancel-in-progress: false
jobs:
  foundation-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate contracts and configuration
        run: |
          python -m unittest discover -s tests -v
          PYTHONPATH=src python -m broker.validation
      - name: Create run manifest
        run: |
          mkdir -p run_artifacts
          printf 'workflow=pre_market\nmode=research_and_paper_only\ncommit=%s\n' "$GITHUB_SHA" > run_artifacts/run-manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: broker-pre-market-${{ github.run_id }}
          path: run_artifacts/
          if-no-files-found: error
          retention-days: 7
