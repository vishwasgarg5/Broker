name: BROKER - Pre-market research pipeline
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Latest acceptable NSE session date (YYYY-MM-DD); blank selects latest published session"
        required: false
        type: string
  schedule:
    - cron: "30 0 * * 1-5" # 06:00 IST; actual session resolved from NSE archive availability
permissions:
  contents: read
concurrency:
  group: broker-pre-market
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate contracts and configuration
        run: |
          python -m unittest discover -s tests -v
          PYTHONPATH=src python -m broker.validation
      - name: Ingest official NSE Nifty 50 snapshot and latest cash bhavcopy
        env:
          REQUESTED_DATE: ${{ github.event.inputs.date }}
        run: |
          if [ -n "$REQUESTED_DATE" ]; then
            python src/data_pipeline.py --date "$REQUESTED_DATE"
          else
            python src/data_pipeline.py
          fi
      - name: Upload immutable run-scoped market data
        uses: actions/upload-artifact@v4
        with:
          name: broker-market-data-${{ github.run_id }}
          path: data/
          if-no-files-found: error
          retention-days: 30
